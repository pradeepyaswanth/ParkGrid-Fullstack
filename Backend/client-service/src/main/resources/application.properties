spring.application.name=client-service

server.port=8085


# ==============================
# EUREKA
# ==============================

eureka.client.service-url.defaultZone=http://localhost:8761/eureka

eureka.client.register-with-eureka=true

eureka.client.fetch-registry=true


# ==============================
# ACTUATOR
# ==============================

management.endpoints.web.exposure.include=health,info

spring.cloud.gateway.server.webmvc.routes[4].id=client-service
spring.cloud.gateway.server.webmvc.routes[4].uri=lb://client-service
spring.cloud.gateway.server.webmvc.routes[4].predicates[0]=Path=/api/client/**