spring.application.name=api-gateway

server.port=8080

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Parking Service
spring.cloud.gateway.server.webmvc.routes[0].id=parking-service
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://PARKING-SERVICE
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/parking/**

# Booking Service
spring.cloud.gateway.server.webmvc.routes[1].id=booking-service
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://BOOKING-SERVICE
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/bookings/**

# Billing Service
spring.cloud.gateway.server.webmvc.routes[2].id=billing-service
spring.cloud.gateway.server.webmvc.routes[2].uri=lb://BILLING-SERVICE
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/api/billing/**

# Auth Service
spring.cloud.gateway.server.webmvc.routes[3].id=auth-service
spring.cloud.gateway.server.webmvc.routes[3].uri=lb://AUTH-SERVICE
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/api/auth/**	